<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<title>巡检系统管理后台</title>
<link rel="stylesheet" href="assets/css/style.css">
<style>
  .admin-tabs { display:flex; gap:4px; margin-bottom:20px; background:var(--bg-secondary); border-radius:var(--radius-md); padding:4px; }
  .admin-tabs .tab { flex:1; padding:8px 12px; text-align:center; border-radius:var(--radius-sm); cursor:pointer; font-size:0.85rem; font-weight:600; color:var(--text-muted); transition:all var(--transition-fast); border:none; background:none; font-family:var(--font-body); }
  .admin-tabs .tab.active { background:var(--accent-dim); color:var(--accent); }
  .admin-tabs .tab:hover:not(.active) { color:var(--text-secondary); }
  .tab-content { display:none; }
  .tab-content.active { display:block; }
  .toolbar { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; align-items:center; }
  .toolbar .spacer { flex:1; }
  .search-input { max-width:240px; }
  .record-summary { cursor:pointer; transition:background var(--transition-fast); }
  .record-summary:hover { background:var(--bg-card-hover); }
  .img-thumb { width:32px; height:32px; object-fit:cover; border-radius:4px; cursor:pointer; }
  .config-section { margin-bottom:24px; padding-bottom:16px; border-bottom:1px solid var(--border-card); }
  .config-section:last-child { border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .config-section h3 { margin-bottom:12px; color:var(--accent); }
  .qr-preview { display:flex; flex-direction:column; align-items:center; gap:12px; padding:20px; background:var(--bg-secondary); border-radius:var(--radius-md); }
  .qr-preview canvas { background:white; padding:12px; border-radius:var(--radius-sm); }
  .config-row { display:flex; align-items:center; gap:12px; margin-bottom:12px; }
  .config-row label { min-width:100px; font-weight:600; color:var(--text-secondary); font-size:0.88rem; }
  .config-row .form-input, .config-row .form-select { flex:1; }
  .admin-header-title { cursor:pointer; }
  @media (max-width:480px) {
    .toolbar { flex-direction:column; align-items:stretch; }
    .search-input { max-width:100%; }
    .data-table { font-size:0.72rem; }
    .data-table th, .data-table td { padding:6px 8px; }
    .config-row { flex-direction:column; align-items:stretch; }
    .config-row label { min-width:auto; }
  }
</style>
</head>
<body>

<header class="app-header">
  <div class="logo">
    <div class="logo-icon">⚙</div>
    <span>巡检系统后台</span>
  </div>
  <nav class="nav-links">
    <a href="index.html" class="active">表单</a>
  </nav>
</header>

<main class="app-main" id="app-content">
  <div class="loading"><div class="spinner"></div><span>加载中...</span></div>
</main>

<!-- ====== TEMPLATES ====== -->
<template id="template-setup">
  <div class="setup-wizard" style="max-width:560px;margin:0 auto;">
    <div class="card">
      <h2>🔑 管理后台登录</h2>
      <p style="color:var(--text-secondary);margin:8px 0 20px;font-size:0.9rem;">
        输入 GitHub Token 以访问管理后台。Token 不会被保存到服务器，仅在当前浏览器会话中使用。
      </p>
      <div class="config-group">
        <label>GitHub Token</label>
        <input type="password" class="form-input" id="login-token"
               placeholder="ghp_xxxxxxxxxxxxxxxxxxxx">
      </div>
      <div class="config-group">
        <label>仓库地址</label>
        <input type="text" class="form-input" id="login-repo"
               placeholder="用户名/仓库名">
      </div>
      <button class="btn btn-primary btn-lg btn-block" id="login-btn">登录后台</button>
      <div id="login-status" style="margin-top:12px;"></div>
    </div>
  </div>
</template>

<template id="template-admin">
  <!-- Tabs -->
  <div class="admin-tabs" id="admin-tabs">
    <button class="tab active" data-tab="records">📋 巡检记录</button>
    <button class="tab" data-tab="photos">📸 照片墙</button>
    <button class="tab" data-tab="config">⚙️ 活码配置</button>
    <button class="tab" data-tab="settings">🔧 系统设置</button>
  </div>

  <!-- Stats -->
  <div class="stats-grid" id="stats-grid">
    <div class="stat-card"><div class="stat-value" id="stat-total">-</div><div class="stat-label">总记录数</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-today">-</div><div class="stat-label">今日提交</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-photos">-</div><div class="stat-label">照片总数</div></div>
    <div class="stat-card"><div class="stat-value" id="stat-buildings">-</div><div class="stat-label">涉及楼栋</div></div>
  </div>

  <!-- TAB: Records -->
  <div class="tab-content active" id="tab-records">
    <div class="toolbar">
      <input type="text" class="form-input search-input" id="search-input"
             placeholder="搜索楼号/房号...">
      <div class="spacer"></div>
      <button class="btn btn-secondary btn-sm" id="refresh-btn">🔄 刷新</button>
      <button class="btn btn-success btn-sm" id="export-btn">📥 导出Excel</button>
      <button class="btn btn-danger btn-sm" id="clear-btn" style="display:none;">🗑 清理</button>
    </div>
    <div class="card">
      <div class="data-table-wrap">
        <table class="data-table" id="records-table">
          <thead>
            <tr>
              <th>编号</th>
              <th>时间</th>
              <th>楼号</th>
              <th>房号</th>
              <th>巡查时间</th>
              <th>照片</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="records-body">
            <tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:24px;">暂无数据</td></tr>
          </tbody>
        </table>
      </div>
      <div class="pagination" id="pagination">
        <button class="btn btn-ghost btn-sm" id="page-prev" disabled>← 上一页</button>
        <span class="page-info" id="page-info">第 1 页</span>
        <button class="btn btn-ghost btn-sm" id="page-next">下一页 →</button>
      </div>
    </div>
  </div>

  <!-- TAB: Photos -->
  <div class="tab-content" id="tab-photos">
    <div class="card">
      <div class="photo-grid" id="photos-wall" style="grid-template-columns:repeat(auto-fill,minmax(100px,1fr));">
        <div class="empty-state" id="photos-empty">
          <div class="icon">📸</div>
          <h3>暂无照片</h3>
          <p>提交巡检记录时将自动上传照片</p>
        </div>
      </div>
    </div>
  </div>

  <!-- TAB: Live QR Config -->
  <div class="tab-content" id="tab-config">
    <div class="card">
      <h3 style="margin-bottom:16px;">📱 活码配置</h3>
      <p style="color:var(--text-secondary);font-size:0.88rem;margin-bottom:20px;">
        活码功能：二维码一旦生成永久不变，通过后台修改跳转目标即可更新内容。
      </p>

      <div class="config-section">
        <h3>跳转设置</h3>
        <div class="config-row">
          <label>启用跳转</label>
          <div class="toggle">
            <input type="checkbox" id="config-redirect-enabled">
            <div class="track"></div>
          </div>
        </div>
        <div class="config-row">
          <label>跳转URL</label>
          <input type="url" class="form-input" id="config-redirect-url"
                 placeholder="https://example.com/new-form">
        </div>
        <div class="form-hint" style="margin-top:-8px;margin-bottom:12px;">
          启用后，扫码将自动跳转到此地址。关闭则显示默认表单。
        </div>
      </div>

      <div class="config-section">
        <h3>表单控制</h3>
        <div class="config-row">
          <label>启用表单</label>
          <div class="toggle">
            <input type="checkbox" id="config-form-enabled">
            <div class="track"></div>
          </div>
        </div>
        <div class="form-hint" style="margin-top:-8px;margin-bottom:12px;">
          关闭后扫码将显示"表单已暂停"，适用于非工作时间。
        </div>
        <div class="config-row">
          <label>表单标题</label>
          <input type="text" class="form-input" id="config-form-title"
                 placeholder="施工现场安全质量巡检表">
        </div>
        <div class="config-row">
          <label>站点名称</label>
          <input type="text" class="form-input" id="config-site-name"
                 placeholder="施工现场巡检系统">
        </div>
      </div>

      <div class="config-section">
        <h3>二维码</h3>
        <div class="qr-preview" id="qr-preview">
          <div id="qr-canvas"></div>
          <div class="qr-url" id="qr-url"></div>
          <button class="btn btn-secondary btn-sm" id="qr-copy-btn">📋 复制链接</button>
        </div>
      </div>

      <button class="btn btn-primary btn-lg btn-block" id="config-save-btn"
              style="margin-top:16px;">💾 保存配置</button>
    </div>
  </div>

  <!-- TAB: System Settings -->
  <div class="tab-content" id="tab-settings">
    <div class="card">
      <h3 style="margin-bottom:16px;">🔧 系统设置</h3>

      <div class="config-section">
        <h3>GitHub 连接</h3>
        <div class="config-row">
          <label>仓库</label>
          <input type="text" class="form-input" id="settings-repo" placeholder="用户名/仓库名" readonly style="background:var(--bg-card);">
        </div>
        <div class="config-row">
          <label>分支</label>
          <input type="text" class="form-input" id="settings-branch" placeholder="main" readonly style="background:var(--bg-card);">
        </div>
      </div>

      <div class="config-section">
        <h3>图片设置</h3>
        <div class="config-row">
          <label>压缩宽度</label>
          <input type="number" class="form-input" id="settings-compress-width" min="400" max="2400" value="1200">
        </div>
        <div class="config-row">
          <label>压缩质量</label>
          <select class="form-select" id="settings-quality">
            <option value="0.5">50% - 最小文件</option>
            <option value="0.75" selected>75% - 推荐</option>
            <option value="0.9">90% - 高质量</option>
            <option value="1">100% - 原图质量</option>
          </select>
        </div>
        <div class="form-hint">降低质量可减少上传时间，建议 75%</div>
      </div>

      <button class="btn btn-primary" id="settings-save-btn">💾 保存设置</button>
    </div>
  </div>
</template>

<template id="template-record-detail">
  <div class="record-detail" id="record-detail-modal">
    <h3>📋 巡检记录详情</h3>
    <div id="detail-content"></div>
    <button class="btn btn-secondary btn-block" style="margin-top:16px;" onclick="this.closest('.record-detail').closest('.modal-overlay').classList.remove('active')">关闭</button>
  </div>
</template>

<script src="assets/js/app.js"></script>
<script>
/* ============================================================
   ADMIN CONTROLLER
   ============================================================ */
class AdminController {
  constructor() {
    this.app = null;
    this.storage = null;
    this.dataMgr = null;
    this.imageUploader = null;
    this.configMgr = null;
    this.submissions = [];
    this.pageSize = 20;
    this.currentPage = 1;
    this.searchQuery = '';
  }

  async init() {
    // Try to load config from settings.json
    const app = new App();
    const config = await app.init();

    if (!config || !config.token || config.token === 'YOUR_GITHUB_TOKEN_HERE' || !config.repo) {
      // Show login
      const container = document.getElementById('app-content');
      container.innerHTML = document.getElementById('template-setup').innerHTML;
      this._setupLogin();
      return;
    }

    this.app = app;
    this.storage = app.storage;
    this.dataMgr = app.dataMgr;
    this.imageUploader = app.imageUploader;
    this.configMgr = app.configMgr;

    // Load admin panel
    const container = document.getElementById('app-content');
    container.innerHTML = document.getElementById('template-admin').innerHTML;

    this._setupTabs();
    this._setupEventHandlers();
    await this._loadData();
    this._setupConfig();
  }

  _setupLogin() {
    // Auto-fill repo from URL if on GitHub Pages
    const app = new App();
    const pageInfo = app.detectRepoInfo();
    if (pageInfo.repo) {
      document.getElementById('login-repo').value = pageInfo.repo;
    }

    document.getElementById('login-btn').addEventListener('click', async () => {
      const token = document.getElementById('login-token').value.trim();
      const repo = document.getElementById('login-repo').value.trim();
      const status = document.getElementById('login-status');

      if (!token || !repo) {
        UI.toast('请填写 Token 和仓库地址', 'error');
        return;
      }

      status.innerHTML = '<div class="loading"><div class="spinner"></div><span>验证中...</span></div>';

      try {
        // Try to read config to verify
        const storage = new GithubStorage(token, repo, 'main');
        const configFile = await storage.readFile('config/settings.json');

        if (configFile) {
          // Config exists, use it
          const config = JSON.parse(configFile.content);
          // Update token in case it changed
          config.token = token;
          this.app = new App();
          this.app.config = config;
          this.app.storage = storage;
          this.app.configMgr = new ConfigManager(storage);
          this.app.dataMgr = new DataManager(storage);
          this.app.imageUploader = new ImageUploader(storage);

          this.storage = storage;
          this.dataMgr = this.app.dataMgr;
          this.imageUploader = this.app.imageUploader;
          this.configMgr = this.app.configMgr;

          // Load admin
          const container = document.getElementById('app-content');
          container.innerHTML = document.getElementById('template-admin').innerHTML;
          this._setupTabs();
          this._setupEventHandlers();
          await this._loadData();
          this._setupConfig();

          UI.toast('登录成功', 'success');
        } else {
          // No config found, try to init
          status.innerHTML = '<div class="alert alert-warning">⚠️ 未找到配置，请先从首页初始化</div>';
        }
      } catch (e) {
        status.innerHTML = `<div class="alert alert-danger">❌ ${UI.escape(e.message)}</div>`;
        UI.toast('验证失败', 'error');
      }
    });
  }

  _setupTabs() {
    document.querySelectorAll('.admin-tabs .tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.admin-tabs .tab').forEach(t => t.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));

        tab.classList.add('active');
        const tabId = tab.dataset.tab;
        const content = document.getElementById(`tab-${tabId}`);
        if (content) {
          content.classList.add('active');
          if (tabId === 'photos') this._renderPhotos();
          if (tabId === 'config') this._renderQR();
        }
      });
    });
  }

  _setupEventHandlers() {
    document.getElementById('refresh-btn').addEventListener('click', () => this._loadData());
    document.getElementById('export-btn').addEventListener('click', () => this._exportExcel());
    document.getElementById('search-input').addEventListener('input', (e) => {
      this.searchQuery = e.target.value;
      this.currentPage = 1;
      this._renderTable();
    });
    document.getElementById('page-prev').addEventListener('click', () => {
      if (this.currentPage > 1) { this.currentPage--; this._renderTable(); }
    });
    document.getElementById('page-next').addEventListener('click', () => {
      const maxPage = Math.ceil(this._getFilteredData().length / this.pageSize);
      if (this.currentPage < maxPage) { this.currentPage++; this._renderTable(); }
    });
    document.getElementById('config-save-btn').addEventListener('click', () => this._saveConfig());
    document.getElementById('settings-save-btn').addEventListener('click', () => this._saveSettings());
    document.getElementById('qr-copy-btn').addEventListener('click', () => {
      UI.copy(window.location.origin + window.location.pathname.replace('/admin.html', '/index.html'));
    });
  }

  async _loadData() {
    try {
      UI.showLoading('records-body', '加载中...');

      this.submissions = await this.dataMgr.loadAllSubmissions();

      this._updateStats();
      this._renderTable();
    } catch (e) {
      document.getElementById('records-body').innerHTML =
        `<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--danger);">
          ❌ 加载失败: ${UI.escape(e.message)}
        </td></tr>`;
      UI.toast('加载数据失败: ' + e.message, 'error');
    }
  }

  _getFilteredData() {
    if (!this.searchQuery) return this.submissions;
    const q = this.searchQuery.toLowerCase();
    return this.submissions.filter(s => {
      const b = (s.basicInfo?.building || '').toLowerCase();
      const u = (s.basicInfo?.unit || '').toLowerCase();
      return b.includes(q) || u.includes(q) || (b + u).includes(q);
    });
  }

  _updateStats() {
    document.getElementById('stat-total').textContent = this.submissions.length;

    const today = new Date();
    const todayStr = today.toISOString().slice(0, 10);
    const todayCount = this.submissions.filter(s => {
      const d = s._savedAt || '';
      return d.slice(0, 10) === todayStr;
    }).length;
    document.getElementById('stat-today').textContent = todayCount;

    // Count photos
    let photoCount = 0;
    this.submissions.forEach(s => {
      if (s.sitePhotos) photoCount += s.sitePhotos.length;
      if (s.hiddenWorks) s.hiddenWorks.forEach(h => { if (h.photos) photoCount += h.photos.length; });
      if (s.bathroomTest?.photos) photoCount += s.bathroomTest.photos.length;
    });
    document.getElementById('stat-photos').textContent = photoCount;

    // Unique buildings
    const buildings = new Set(this.submissions.map(s => s.basicInfo?.building || '').filter(Boolean));
    document.getElementById('stat-buildings').textContent = buildings.size;
  }

  _renderTable() {
    const filtered = this._getFilteredData();
    const maxPage = Math.ceil(filtered.length / this.pageSize) || 1;
    if (this.currentPage > maxPage) this.currentPage = maxPage;

    const start = (this.currentPage - 1) * this.pageSize;
    const pageData = filtered.slice(start, start + this.pageSize);

    const tbody = document.getElementById('records-body');

    if (pageData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;padding:24px;color:var(--text-muted);">
        ${this.searchQuery ? '未找到匹配记录' : '暂无数据'}
      </td></tr>`;
    } else {
      tbody.innerHTML = pageData.map(s => {
        const photoCount = (s.sitePhotos?.length || 0) +
          (s.hiddenWorks?.reduce((a, h) => a + (h.photos?.length || 0), 0) || 0) +
          (s.bathroomTest?.photos?.length || 0);

        return `<tr class="record-summary" data-id="${UI.escape(s.id)}">
          <td><span class="record-id">${UI.escape(s.id)}</span></td>
          <td style="white-space:nowrap;">${UI.formatDate(s._savedAt)}</td>
          <td>${UI.escape(s.basicInfo?.building || '-')}</td>
          <td>${UI.escape(s.basicInfo?.unit || '-')}</td>
          <td style="white-space:nowrap;">${UI.escape(s.basicInfo?.inspectionTime || '-')}</td>
          <td>${photoCount > 0 ? '📷' + photoCount : '-'}</td>
          <td><button class="btn btn-ghost btn-sm view-record" data-id="${UI.escape(s.id)}">查看</button></td>
        </tr>`;
      });

      // View record handler
      tbody.querySelectorAll('.view-record').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = btn.dataset.id;
          const record = this.submissions.find(s => s.id === id);
          if (record) this._showRecordDetail(record);
        });
      });

      // Click row
      tbody.querySelectorAll('.record-summary').forEach(row => {
        row.addEventListener('click', () => {
          const id = row.dataset.id;
          const record = this.submissions.find(s => s.id === id);
          if (record) this._showRecordDetail(record);
        });
      });
    }

    // Pagination
    document.getElementById('page-info').textContent = `第 ${this.currentPage} / ${maxPage} 页`;
    document.getElementById('page-prev').disabled = this.currentPage <= 1;
    document.getElementById('page-next').disabled = this.currentPage >= maxPage;
  }

  _showRecordDetail(record) {
    // Build detail content
    const div = document.createElement('div');

    const addField = (label, value) => {
      if (value === undefined || value === null || value === '') return;
      div.innerHTML += `<div class="detail-field">
        <div class="field-label">${UI.escape(label)}</div>
        <div class="field-value">${UI.escape(String(value))}</div>
      </div>`;
    };

    addField('记录编号', record.id);
    addField('提交时间', UI.formatDate(record._savedAt));
    addField('楼号', record.basicInfo?.building);
    addField('房号', record.basicInfo?.unit);
    addField('巡查时间', record.basicInfo?.inspectionTime);

    // Safety
    if (record.safetyInspection) {
      div.innerHTML += '<div class="detail-field"><div class="field-label">安全巡查</div></div>';
      for (const [k, v] of Object.entries(record.safetyInspection)) {
        if (v) div.innerHTML += `<div style="margin-left:12px;font-size:0.85rem;color:var(--text-secondary);">${UI.escape(k)}: ${UI.escape(v)}</div>`;
      }
    }

    // Hidden works
    if (record.hiddenWorks && record.hiddenWorks.length > 0) {
      div.innerHTML += '<div class="detail-field" style="margin-top:8px;"><div class="field-label">隐蔽验收</div></div>';
      record.hiddenWorks.forEach(h => {
        div.innerHTML += `<div style="margin-left:12px;font-size:0.85rem;color:var(--text-secondary);margin-bottom:4px;">
          <strong>${UI.escape(h.name)}</strong> → ${UI.escape(h.conclusion || '-')} (${UI.escape(h.inspector || '-')})
        </div>`;
      });
    }

    // Photos grid
    const allPhotos = [
      ...(record.sitePhotos || []).map(p => ({ url: this.storage.getRawUrl(p), label: '现场照片' })),
      ...(record.bathroomTest?.photos || []).map(p => ({ url: this.storage.getRawUrl(p), label: '蓄水验收' })),
      ...(record.hiddenWorks || []).flatMap(h =>
        (h.photos || []).map(p => ({ url: this.storage.getRawUrl(p), label: h.name }))
      )
    ];

    if (allPhotos.length > 0) {
      div.innerHTML += '<div class="detail-field"><div class="field-label">照片 ('+allPhotos.length+')</div>';
      div.innerHTML += '<div class="detail-photos">';
      allPhotos.forEach(p => {
        div.innerHTML += `<img src="${UI.escape(p.url)}" alt="${UI.escape(p.label)}" onclick="AdminController.openPhoto('${UI.escape(p.url)}')">`;
      });
      div.innerHTML += '</div></div>';
    }

    // Measurements
    if (record.tileMeasurement) {
      div.innerHTML += '<div class="detail-field" style="margin-top:8px;"><div class="field-label">墙地砖空鼓实测</div></div>';
      for (const [k, v] of Object.entries(record.tileMeasurement)) {
        if (v) div.innerHTML += `<div style="margin-left:12px;font-size:0.85rem;color:var(--text-secondary);">${UI.escape(k)}: ${UI.escape(v)}</div>`;
      }
    }

    if (record.puttyMeasurement) {
      div.innerHTML += '<div class="detail-field" style="margin-top:8px;"><div class="field-label">腻子面实测合格率</div></div>';
      for (const [k, v] of Object.entries(record.puttyMeasurement)) {
        if (v) div.innerHTML += `<div style="margin-left:12px;font-size:0.85rem;color:var(--text-secondary);">${UI.escape(k)}: ${UI.escape(v)}</div>`;
      }
    }

    // Bathroom test
    if (record.bathroomTest?.inspector || record.bathroomTest?.conclusion) {
      div.innerHTML += '<div class="detail-field" style="margin-top:8px;"><div class="field-label">卫生间蓄水验收</div></div>';
      addField('验收人', record.bathroomTest.inspector);
      addField('验收结论', record.bathroomTest.conclusion);
    }

    // Show modal
    let overlay = document.querySelector('.modal-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      document.body.appendChild(overlay);
    }
    overlay.innerHTML = document.getElementById('template-record-detail').innerHTML;
    overlay.querySelector('#detail-content').appendChild(div);
    overlay.classList.add('active');
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('active');
    });
  }

  static openPhoto(url) {
    let overlay = document.querySelector('.modal-overlay');
    if (!overlay) {
      overlay = document.createElement('div');
      overlay.className = 'modal-overlay';
      document.body.appendChild(overlay);
    }
    overlay.innerHTML = `<img src="${UI.escape(url)}" alt="照片" style="max-width:90vw;max-height:90vh;">`;
    overlay.classList.add('active');
    overlay.addEventListener('click', (e) => {
      if (e.target === overlay) overlay.classList.remove('active');
    });
  }

  async _renderPhotos() {
    const wall = document.getElementById('photos-wall');
    const empty = document.getElementById('photos-empty');

    // Collect all photos from all submissions
    const allPhotos = [];
    this.submissions.forEach(s => {
      (s.sitePhotos || []).forEach(p => {
        allPhotos.push({ url: this.storage.getRawUrl(p), label: `${s.basicInfo?.building || '?'}#${s.basicInfo?.unit || '?'}` });
      });
      (s.hiddenWorks || []).forEach(h => {
        (h.photos || []).forEach(p => {
          allPhotos.push({ url: this.storage.getRawUrl(p), label: `${h.name}` });
        });
      });
      (s.bathroomTest?.photos || []).forEach(p => {
        allPhotos.push({ url: this.storage.getRawUrl(p), label: '蓄水验收' });
      });
    });

    if (allPhotos.length === 0) {
      if (empty) empty.style.display = '';
      return;
    }

    if (empty) empty.style.display = 'none';

    wall.innerHTML = allPhotos.map(p =>
      `<div class="photo-item" onclick="AdminController.openPhoto('${UI.escape(p.url)}')">
        <img src="${UI.escape(p.url)}" alt="${UI.escape(p.label)}" loading="lazy">
      </div>`
    ).join('');
  }

  _setupConfig() {
    if (!this.app?.config) return;

    const config = this.app.config;
    document.getElementById('config-redirect-enabled').checked = config.redirectEnabled || false;
    document.getElementById('config-redirect-url').value = config.redirectUrl || '';
    document.getElementById('config-form-enabled').checked = config.formEnabled !== false;
    document.getElementById('config-form-title').value = config.formTitle || '';
    document.getElementById('config-site-name').value = config.siteName || '';

    // Settings tab
    document.getElementById('settings-repo').value = config.repo || '';
    document.getElementById('settings-branch').value = config.branch || 'main';
    document.getElementById('settings-compress-width').value = config.uploadCompressWidth || 1200;

    // Set quality
    const qSelect = document.getElementById('settings-quality');
    const q = config.uploadQuality || 0.75;
    for (const opt of qSelect.options) {
      if (parseFloat(opt.value) === q) { opt.selected = true; break; }
    }

    this._renderQR();
  }

  _renderQR() {
    const container = document.getElementById('qr-canvas');
    if (!container) return;

    const url = window.location.origin + window.location.pathname.replace('/admin.html', '/index.html');
    document.getElementById('qr-url').textContent = url;

    // Clear old
    container.innerHTML = '';

    // Use QR Server API as fallback, or try qrcodejs
    if (typeof QRCode !== 'undefined') {
      new QRCode(container, { text: url, width: 180, height: 180 });
    } else {
      // Load QRCode library
      const script = document.createElement('script');
      script.src = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';
      script.onload = () => new QRCode(container, { text: url, width: 180, height: 180 });
      script.onerror = () => {
        // Fallback: use an API
        container.innerHTML = `<img src="https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(url)}" alt="QR Code">`;
      };
      document.head.appendChild(script);
    }
  }

  async _saveConfig() {
    try {
      const config = this.app.config;
      config.redirectEnabled = document.getElementById('config-redirect-enabled').checked;
      config.redirectUrl = document.getElementById('config-redirect-url').value.trim();
      config.formEnabled = document.getElementById('config-form-enabled').checked;
      config.formTitle = document.getElementById('config-form-title').value.trim();
      config.siteName = document.getElementById('config-site-name').value.trim();

      await this.configMgr.save(config);
      this.app.config = config;
      UI.toast('配置保存成功！活码已更新', 'success');
    } catch (e) {
      UI.toast('保存失败: ' + e.message, 'error');
    }
  }

  async _saveSettings() {
    try {
      const config = this.app.config;
      config.uploadCompressWidth = parseInt(document.getElementById('settings-compress-width').value) || 1200;
      config.uploadQuality = parseFloat(document.getElementById('settings-quality').value) || 0.75;

      await this.configMgr.save(config);
      this.app.config = config;
      UI.toast('设置保存成功', 'success');
    } catch (e) {
      UI.toast('保存失败: ' + e.message, 'error');
    }
  }

  async _exportExcel() {
    try {
      const dataToExport = this.searchQuery ? this._getFilteredData() : this.submissions;
      if (dataToExport.length === 0) {
        UI.toast('没有可导出的数据', 'warning');
        return;
      }
      UI.toast(`正在生成 Excel（${dataToExport.length} 条记录）...`, 'info');
      const filename = `巡检台账_${new Date().toISOString().slice(0, 10)}.xlsx`;
      await ExcelExporter.export(dataToExport, filename);
      UI.toast(`导出成功！共 ${dataToExport.length} 条记录`, 'success');
    } catch (e) {
      UI.toast('导出失败: ' + e.message, 'error');
    }
  }
}

/* ============================================================
   BOOT
   ============================================================ */
// Expose AdminController globally for onclick handlers
window.AdminController = AdminController;

document.addEventListener('DOMContentLoaded', () => {
  const admin = new AdminController();
  admin.init().catch(e => {
    console.error('Admin init failed:', e);
    const el = document.getElementById('app-content');
    if (el) el.innerHTML = '<div class="card" style="text-align:center;padding:40px;color:var(--danger);"><h3>⚠️ 加载失败</h3><p>' + UI.escape(e.message || '未知错误') + '</p><button class="btn btn-primary" onclick="location.reload()" style="margin-top:12px;">重新加载</button></div>';
  });
});
</script>
